name: Notify IBF of submodule update

on:
  push:
    branches: [ibf-main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.NRW_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NRW_AUTOMATION_APP_PRIVATE_KEY }}
          owner: rodekruis
          repositories: IBF

      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: rodekruis/IBF
          event-type: submodule-update